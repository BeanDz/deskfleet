name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_smoke_build:
        description: Build Linux x64 only when called for a pull request.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pr_smoke_build && github.event_name == 'pull_request' && '[{"platform":"linux-x64","os":"ubuntu-24.04"}]' || '[{"platform":"linux-x64","os":"ubuntu-24.04"},{"platform":"linux-arm64","os":"ubuntu-24.04-arm"},{"platform":"macos-x64","os":"macos-15-intel"},{"platform":"macos-arm64","os":"macos-latest"},{"platform":"windows-x64","os":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

      - name: Build the server and native addon
        run: mise run build

      - name: Stage and verify native artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux) cp target/release/deskfleet-server dist/; cp target/release/libdeskfleet_node.so dist/deskfleet.node ;;
            macOS) cp target/release/deskfleet-server dist/; cp target/release/libdeskfleet_node.dylib dist/deskfleet.node ;;
            Windows) cp target/release/deskfleet-server.exe dist/; cp target/release/deskfleet_node.dll dist/deskfleet.node ;;
          esac
          node -e "console.log(require('./dist/deskfleet.node').nativeInfo())"
          tar -czf "deskfleet-$PLATFORM.tar.gz" -C dist .

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-${{ matrix.platform }}
          path: deskfleet-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache health
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: mise run ci:report:sccache
