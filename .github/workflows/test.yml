name: Test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      docs_only:
        description: Keep static checks and skip runtime tests for classified documentation changes.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache-rust-build: "true"

      - name: Run static checks
        run: mise run ci:check:static

      - name: Report compiler cache health
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: mise run ci:report:sccache

  checks:
    name: Tests (${{ matrix.name }})
    if: >-
      ${{ !(inputs.docs_only &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache-rust-build: "true"

      - name: Run tests
        run: mise run test

      - name: Report compiler cache health
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: mise run ci:report:sccache
