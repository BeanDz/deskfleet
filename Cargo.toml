[workspace]
members = [
    "apps/server",
    "crates/model",
    "crates/native",
    "crates/node",
    "crates/protocol",
]
exclude = [".agents/skills/rust-skills/checks"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/yet-another-ai/deskfleet"
publish = false

[workspace.dependencies]
deskfleet-model = { path = "crates/model" }
deskfleet-native = { path = "crates/native" }
deskfleet-protocol = { path = "crates/protocol" }

actix-web = { version = "4.17", default-features = false, features = ["macros"] }
napi = { version = "3.15", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-build = "2.6"
napi-derive = "3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
